[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turbine_etl"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.0",
    "pytest",
    "flake8",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["turbine_etl*"]
