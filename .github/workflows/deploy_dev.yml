name: Deploy Dev

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - development

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dependencies
        run: pip install .

      - name: Run flake8
        run: flake8 .

      - name: Run pytest
        run: pytest

  black-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install black
        run: pip install black

      - name: Apply black formatting
        run: black .

      - name: Open PR with formatting fixes, if any
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Apply black formatting"
          branch: black-formatting/${{ github.head_ref }}
          title: "Apply black formatting to ${{ github.head_ref }}"
          body: Automated formatting fixes for this PR, generated by black.
          base: ${{ github.head_ref }}
